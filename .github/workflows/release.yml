# Bump semver from conventional commits, build macOS app, publish GitHub Release.
#
# Commit message examples (Angular conventions):
#   fix: ...     → patch  (1.0.0 → 1.0.1)
#   feat: ...    → minor  (1.0.0 → 1.1.0)
#   feat!: ...   → major  (1.0.0 → 2.0.0)
#
# Tagging: https://github.com/marketplace/actions/github-tag
# Release:  https://github.com/marketplace/actions/gh-release
#
# Requires repository secret: GH_TOKEN (PAT with repo + contents write)

name: Release

on:
  push:
    branches:
      - mac-version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          release_branches: main,mac-version
          default_bump: patch
          tag_prefix: v

      # CI-only: bump package.json so electron-builder embeds the same semver as the tag (not pushed).
      - name: Sync package.json version
        if: steps.tag_version.outputs.new_version != ''
        run: node scripts/sync-package-version.js "${{ steps.tag_version.outputs.new_version }}"

      - name: Install dependencies
        if: steps.tag_version.outputs.new_tag != ''
        run: npm ci

      - name: Write build metadata
        if: steps.tag_version.outputs.new_tag != ''
        run: npm run version:write-meta

      - name: Build macOS app
        if: steps.tag_version.outputs.new_tag != ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac

      - name: Prepare release notes
        if: steps.tag_version.outputs.new_tag != ''
        run: printf '%s\n' "${{ steps.tag_version.outputs.changelog }}" > release-notes.md

      - name: Create GitHub Release and upload assets
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml
            dist/*.blockmap
          fail_on_unmatched_files: true

      - name: No release (no new tag)
        if: steps.tag_version.outputs.new_tag == ''
        run: echo "No new version tag — skipping build (no releasable commits since last tag)."
